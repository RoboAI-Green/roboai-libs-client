[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboai-libs-client"
dynamic = ["version"]
description = "Python client SDK for the RoboAI LIBS Spectrum Simulator API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "RoboAI Green" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.scripts]
roboai-libs = "roboai_libs_client.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0"
]

[tool.setuptools.dynamic]
version = { attr = "roboai_libs_client.__version__" }

[tool.setuptools.packages.find]
include = ["roboai_libs_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
